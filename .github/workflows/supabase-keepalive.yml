name: Supabase keep-alive

# O plano gratuito do Supabase pausa projetos após ~7 dias sem atividade.
# Esta consulta leve de 3 em 3 dias mantém o projeto ativo.
# Nota: o GitHub desativa workflows agendados em repositórios sem commits
# durante 60 dias; nesse caso basta reativar em Actions.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta à base de dados
        run: |
          set -a; . ./.env; set +a
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/roles?select=id&limit=1")
          echo "HTTP $status"
          test "$status" = "200"
